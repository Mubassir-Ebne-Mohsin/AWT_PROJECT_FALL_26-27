# Local development services only (Postgres + Redis). The API and web app run on the host.
#   docker compose -f docker-compose.dev.yml up -d
# Credentials default to the values in .env.example; override them from .env.
name: stressforge-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stressforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stressforge}
      POSTGRES_DB: ${DB_DATABASE:-stressforge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - stressforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - stressforge_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stressforge_pgdata:
  stressforge_redisdata:
