    window.addEventListener('pointerup', up);
    return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  }, [!!ghost]);

  const u = s.undo[d.id] || { past: [], future: [] };
  const coachSteps = [
    { t: 'Add an App server', done: d.nodes.some(n => n.type === 'app') },
    { t: 'Connect Clients to it', done: d.nodes.some(n => n.type === 'client' && d.edges.some(e => e.from === n.id)) },
    { t: 'Add a Database and connect it', done: d.nodes.some(n => n.type === 'db' && d.edges.some(e => e.to === n.id)) },
    { t: 'Run your first stress test', done: (d.runs || []).length > 0 }
  ];
  const showCoach = d.source === 'blank' && !s.coachHidden[d.id] && coachSteps.some(x => !x.done);
  const tools = ({ zoom, api: a }) => html`<div class="cv-tools" role="toolbar" aria-label="Canvas tools">
    <button class="btn btn-ghost icon" aria-pressed=${!connectMode} title="Select and move (Esc)" aria-label="Select tool" onClick=${() => setConnectMode(false)}><${Icon} n="cursor" /></button>
    <button class="btn btn-ghost icon" aria-pressed=${connectMode} title="Connect: click a source, then a target (C)" aria-label="Connect tool" onClick=${() => setConnectMode(!connectMode)}><${Icon} n="link" /></button>
    <span class="vsep"></span>
    <button class="btn btn-ghost icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled=${!u.past.length} onClick=${() => Actions.undo(d.id)}><${Icon} n="undo" /></button>
    <button class="btn btn-ghost icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled=${!u.future.length} onClick=${() => Actions.redo(d.id)}><${Icon} n="redo" /></button>
    <button class="btn btn-ghost icon" title="Delete selected (Delete)" aria-label="Delete selected" disabled=${!sel} onClick=${del}><${Icon} n="trash" /></button>
    <span class="vsep"></span>
    <button class="btn btn-ghost icon" title="Zoom out (−)" aria-label="Zoom out" onClick=${() => a.zoomBy(1 / 1.2)}><${Icon} n="zoomOut" /></button>
    <span class="cv-zoom num">${Math.round(zoom * 100)}%</span>
    <button class="btn btn-ghost icon" title="Zoom in (+)" aria-label="Zoom in" onClick=${() => a.zoomBy(1.2)}><${Icon} n="zoomIn" /></button>
    <button class="btn btn-ghost icon" title="Fit to screen (F)" aria-label="Fit to screen" onClick=${() => a.fit()}><${Icon} n="fit" /></button>
    <span class="vsep"></span>
    <button class="btn btn-ghost btn-sm" aria-pressed=${overlay} title="Colour components by load (L)" onClick=${() => setOverlay(!overlay)}><${Icon} n="heat" s=${14} /> Load</button>
  </div>`;

        ${types.map(t => html`<button class="pal-item" title=${E.CATALOG[t].label + ': ' + E.CATALOG[t].blurb} onPointerDown=${(e) => { e.preventDefault(); setGhost({ type: t, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false }); }} onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const c = api.current.center(); addAt(t, c.x, c.y); } }}>
          <span class="gl"><${Glyph} type=${t} /></span>
          <span class="txt"><span class="nm">${E.CATALOG[t].label}</span><br /><span class="cp">${t === 'client' ? 'traffic entry' : fmt.rps(E.CATALOG[t].capacity) + '/s · ' + E.CATALOG[t].latency + ' ms'}</span></span>
        </button>`)}</div>`)}
      <p class="hint" style="padding:0 6px">Drag onto the canvas, or click to drop in the middle.</p>
    </aside>
    <div class="ed-canvas">
      <${Canvas} d=${d} sim=${sim} overlay=${overlay} sel=${sel} setSel=${setSel} connectMode=${connectMode} apiRef=${api} onMove=${onMove} onConnect=${onConnect} highlight=${bneck && bneck.rho >= 0.75 ? bneck.id : null} tools=${tools} mini=${true} />
      ${connectMode && html`<div class="note accent" style="position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:5;box-shadow:var(--shadow)"><${Icon} n="link" /><div>Connect mode: click a source, then a target. Press Esc to stop.</div></div>`}
      ${showCoach && html`<div class="panel coach">
        <div class="row between"><span class="eyebrow">First steps</span><button class="btn btn-ghost icon btn-sm" aria-label="Hide checklist" onClick=${() => Store.set(st => Object.assign({}, st, { coachHidden: Object.assign({}, st.coachHidden, { [d.id]: true }) }))}><${Icon} n="x" s=${14} /></button></div>
        <ol>${coachSteps.map(x => html`<li class=${x.done ? 'done' : ''}><${Icon} n=${x.done ? 'check' : 'clock'} s=${14} style=${x.done ? 'color:var(--ok)' : ''} /><span>${x.t}</span></li>`)}</ol>

    </div>

  </div>`;

function niceStep(range, n) {

function useRunProgress(d) {
  const s = S();
  const running = s.running && s.running.id === d.id ? s.running : null;
  const [p, setP] = useState(running ? 0 : 1);
  useEffect(() => {
    if (!running) { setP(1); return; }
    let raf = 0;
    const tick = () => { const v = (Date.now() - running.start) / running.dur; setP(Math.min(1, v)); if (v < 1) raf = requestAnimationFrame(tick); };
    tick();
    return () => cancelAnimationFrame(raf);
  }, [running && running.start]);
  return { running: !!running, p };
}

function verdictText(d, sim) {
  const t = d.traffic, b = sim.bottleneck;
  const parts = [];
  if (sim.verdict === 'fail') {
    if (sim.errorRate > t.errorBudget) parts.push(fmt.pct(sim.errorRate) + ' of requests fail, over the ' + fmt.pct(t.errorBudget) + ' budget.');
    if (sim.p95 > t.sloP95) parts.push('p95 is ' + fmt.ms(sim.p95) + ', over the ' + fmt.ms(t.sloP95) + ' target.');
    if (b && b.rho >= 0.75) parts.push(b.label + ' runs at ' + fmt.util(b.rho) + ' of its capacity.');
    else if (sim.crossRegion.length) parts.push('Nothing is overloaded: the time goes into calls that cross regions.');
    return { title: 'Breaks under this load', sub: parts.join(' ') };
  }
  if (sim.verdict === 'strained') {
    if (b && b.rho >= 0.75) parts.push(b.label + ' is at ' + fmt.util(b.rho) + '. Past about 80%, waiting time climbs steeply.');
    if (sim.p95 > t.sloP95 * 0.8) parts.push('p95 is ' + fmt.ms(sim.p95) + ', within ' + Math.round((1 - sim.p95 / t.sloP95) * 100) + '% of the target.');
    const g = sim.queues.find(q => q.state === 'growing');
    if (g) parts.push(g.label + ' builds a backlog that never clears during the test.');
    return { title: 'Passes, with little headroom', sub: parts.join(' ') || 'It meets the target, but a small increase in traffic would break it.' };
  }
  return { title: 'Passes comfortably', sub: 'p95 is ' + fmt.ms(sim.p95) + ' against a ' + fmt.ms(t.sloP95) + ' target' + (b ? ', and the busiest component, ' + b.label + ', is at ' + fmt.util(b.rho) + '.' : ', and no component is above 50%.') };
}
function explain(d, sim) {
  const out = [];
  const b = sim.bottleneck;
  if (b && b.rho >= 1) out.push(b.label + ' gets ' + fmt.int(b.peak) + ' requests/s at peak but can handle ' + fmt.int(b.cap) + '/s. It rejects ' + fmt.pct(b.errors) + ' of them and the rest wait in a full queue, which is where the slow tail comes from.');
  else if (b && b.rho >= 0.75) out.push(b.label + ' runs at ' + fmt.util(b.rho) + '. Queueing theory says waiting time grows like ρ/(1−ρ): going from 80% to 95% roughly quadruples it.');
  const cache = d.nodes.find(n => n.type === 'cache');
  const dbn = sim.nodes.find(n => n.type === 'db');
  if (dbn && !cache && dbn.reads > dbn.writes && dbn.rho > 0.5) out.push('Every read goes to ' + dbn.label + ' because there is no cache in front of it.');
  if (cache && dbn) { const hr = E.propsOf(cache).hitRatio; out.push(cache.label + ' answers ' + Math.round(hr * 100) + '% of reads, so ' + dbn.label + ' only sees the ' + Math.round((1 - hr) * 100) + '% that miss.'); }
  sim.crossRegion.slice(0, 1).forEach(x => out.push('Calls from ' + fmt.region(x.fromRegion) + ' to ' + fmt.region(x.toRegion) + ' add ' + x.rtt + ' ms each. More capacity doesn’t fix distance.'));
  sim.queues.forEach(q => {
    if (q.state === 'growing') out.push(q.label + ' receives ' + fmt.rps(q.arrival) + ' jobs/s but workers drain ' + fmt.rps(q.drain) + '/s, so the backlog grows to about ' + fmt.rps(q.backlog) + ' messages by the end.');
    else if (q.state === 'absorbing') out.push(q.label + ' soaks up bursts: workers fall behind for a minute and catch up within about ' + Math.max(1, Math.round(q.lag)) + ' s.');
  });
  sim.backgroundIssues.forEach(x => out.push(x.label + ' rejects ' + fmt.pct(x.dropped) + ' of background calls. Users don’t wait for it, but those jobs fail.'));
  return out;
}

          <div class="panel-b stack">
            <div class="budget" role="img" aria-label="Average latency split by component">${parts.map((x, i) => html`<div title=${x.label + ': ' + fmt.ms(x.v)} style=${'width:' + (x.v / tot * 100) + '%;background:' + (x.st === 'net' ? 'var(--ink-4)' : x.st === 'fail' ? 'var(--fail)' : x.st === 'warn' ? 'var(--warn)' : 'var(--accent)') + ';opacity:' + (x.st === 'net' ? 0.7 : Math.max(0.35, 1 - i * 0.13))}></div>`)}</div>
            <dl class="kv">${parts.map(x => html`<dt>${x.label}</dt><dd>${fmt.ms(x.v)} · ${Math.round(x.v / tot * 100)}%</dd>`)}</dl>
            <p class="hint">Average ${fmt.ms(sim.mean)} per request. p95 is higher because the slow routes above are rarer but much slower.</p>
          </div></section>
        <section class="panel" style=${dim}><div class="panel-h"><h2 class="h3">Why it ended this way</h2></div>
          <div class="panel-b stack">
            <ul class="ph-list">${explain(d, sim).map(x => html`<li><${Icon} n="arrowR" s=${14} /><span>${x}</span></li>`)}</ul>
            <div class="row"><${Link} to=${'/designs/' + d.id + '/limits'} cls="btn btn-sm"><${Icon} n="gauge" s=${14} /> Find the breaking point<//><${Link} to=${'/designs/' + d.id + '/improve'} cls="btn btn-sm"><${Icon} n="sparkle" s=${14} /> Improve <span class="ph-mark">P3</span><//></div>
          </div></section>
        <section class="panel"><div class="panel-h"><h2 class="h3">Recent runs</h2><${Link} to=${'/designs/' + d.id + '/history'} cls="btn btn-ghost btn-sm">History <span class="ph-mark">P3</span><//></div>
          <div class="panel-b">${(d.runs || []).length ? (d.runs || []).slice(0, 4).map(r => html`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line-soft)"><span class="small">${fmt.ago(r.at)} · <span class="mono">${fmt.rps(r.rps)} rps</span></span><span class="row tight"><span class="mono small">${fmt.ms(r.p95)}</span><${VerdictPill} v=${r.verdict} sm /></span></div>`)
            : html`<p class="muted small">No runs yet. Press Run test to record one.</p>`}</div></section>
      </div>
    </div>
  </div>`;
}

function LimitsTab({ d }) {
  const sim = simOf(d);
  const [anim, setAnim] = useState(1);
  const raf = useRef(0);
  useEffect(() => () => cancelAnimationFrame(raf.current), []);
  if (!sim.ok) return html`<${SimFailed} d=${d} sim=${sim} where="limits" />`;
  const L = limitsOf(d);
  const t = d.traffic;
  const replay = () => {
    const t0 = Date.now(), dur = 1800;
    cancelAnimationFrame(raf.current);
    const tick = () => { const v = Math.min(1, (Date.now() - t0) / dur); setAnim(v); if (v < 1) raf.current = requestAnimationFrame(tick); };
    tick();
  };
  const first = L.firstId ? sim.byId[L.firstId] || L.at && L.at.byId[L.firstId] : null;
  const brk = L.breakRps;
  const done = anim >= 1;
  const order = L.order.slice(0, 8);
  const maxSat = Math.max(...order.map(o => isFinite(o.satRps) ? o.satRps : 0), 1);
  const causeWord = { latency: 'p95 crosses the target', errors: 'errors pass the budget', both: 'latency and errors both fail' };
  return html`<div class="ws-page stack lg">
    <div class="row between"><div class="stack" style="gap:4px"><h2 class="h2">Breaking point</h2><p class="muted">Traffic ramps from zero until p95 passes ${fmt.ms(t.sloP95)} or errors pass ${fmt.pct(t.errorBudget)}. Bursts of ×${t.burst} stay on throughout.</p></div>
      <div class="row"><${Link} to=${'/designs/' + d.id + '/traffic'} cls="btn btn-sm">Change targets<//><button class="btn btn-primary btn-sm" onClick=${replay} disabled=${!done}><${Icon} n="play" s=${14} /> Ramp it again</button></div></div>
    <div class="readouts" style=${done ? '' : 'opacity:.5'}>
      <div class="readout"><div class="eyebrow">Breaks at</div><div class="v c-fail">${brk === Infinity ? 'Never' : brk === 0 ? 'Any load' : html`${fmt.int(brk)}<small>rps</small>`}</div><div class="s">${brk > 0 && isFinite(brk) ? 'peaks of ' + fmt.int(brk * t.burst) + ' rps' : brk === 0 ? 'misses the target with almost no traffic' : 'up to 5M rps tested'}</div></div>
      <div class="readout"><div class="eyebrow">Fails because</div><div class="v" style="font-size:17px;margin-top:8px">${L.cause ? causeWord[L.cause] : 'nothing fails'}</div><div class="s">${L.at ? 'p95 ' + fmt.ms(L.at.p95) + ' · errors ' + fmt.pct(L.at.errorRate) : '—'}</div></div>
      <div class="readout"><div class="eyebrow">Gives out first</div><div class="v" style="font-size:17px;margin-top:8px">${first ? first.label : '—'}</div><div class="s">${L.at && first && L.at.byId[first.id] ? 'at ' + fmt.util(L.at.byId[first.id].rho) + ' when it breaks' : brk === 0 && sim.crossRegion.length ? 'distance, not capacity' : ''}</div></div>
      <div class="readout"><div class="eyebrow">Headroom</div><div class=${'v ' + (L.headroom < 1 ? 'c-fail' : L.headroom < 1.5 ? 'c-warn' : 'c-ok')}>${L.headroom === Infinity ? '∞' : L.headroom.toFixed(1) + '×'}</div><div class="s">vs ${fmt.int(t.rps)} rps today</div></div>
    </div>
    <div class="split">
      <section class="panel" style="min-width:0"><div class="panel-h"><h2 class="h3">Ramp test</h2><div class="legend"><span><i style="background:var(--accent)"></i>p95</span><span><i style="background:var(--accent);opacity:.5"></i>p99</span><span><i style="background:var(--fail)"></i>errors</span><span><i style="background:var(--warn)"></i>limits</span></div></div>
        <div class="panel-b"><${RampChart} curve=${L.curve} slo=${t.sloP95} budget=${t.errorBudget} cur=${t.rps} brk=${brk} progress=${anim} />
        ${!done && html`<p class="mono small c-accent">Ramping… ${fmt.int(L.curve[L.curve.length - 1].rps * anim)} rps</p>`}</div></section>
      <section class="panel" style=${'min-width:0;' + (done ? '' : 'opacity:.5')}><div class="panel-h"><h2 class="h3">Failure order</h2><span class="hint">When each component hits 100%</span></div>
        <div class="panel-b">${order.map((o, i) => html`<div class="fo-row">
            <span class="ix">${i + 1}</span>
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${i === 0 ? 700 : 500}">${o.label}</span>
            <div class="fo-bar"><i style=${'width:' + Math.max(2, Math.min(100, (isFinite(o.satRps) ? o.satRps : maxSat) / maxSat * 100)) + '%;background:' + (o.satRps <= t.rps ? 'var(--fail)' : o.satRps <= t.rps * 1.5 ? 'var(--warn)' : 'var(--ok)')}></i></div>
            <span class="mono small num nowrap">${fmt.rps(o.satRps)} rps <span class="muted">${(o.satRps / t.rps).toFixed(1)}×</span></span>
          </div>`)}
          <p class="hint" style="margin-top:10px">Red: already past 100% at today’s traffic. Amber: within 1.5×. The design can break before anything hits 100% if waiting time pushes p95 over the target.</p></div></section>
    </div>
    ${brk === 0 && html`<div class="note warn"><${Icon} n="globe" /><div>This design misses its p95 target even with almost no traffic, so the cause is latency built into the layout, not capacity. ${sim.crossRegion.length ? 'Calls cross regions: move the servers next to the users.' : 'Check component service times.'}</div></div>`}
  </div>`;
}

/* =====================================================================
   SECTION 17 — APP ROOT, GLOBAL KEYS, BOOT
   In Next.js: app/layout.tsx + middleware for the auth guard
   ===================================================================== */
function pickScreen(s) {
  const r = s.route;
  if (s.ui.system && s.ui.system !== 'session') return html`<${SystemScreen} key=${'sys-' + s.ui.system} kind=${s.ui.system} fromDev=${true} />`;
  if (!r) return null;
  if (r.id === 'notfound') return html`<${SystemScreen} key="nf" kind="404" path=${r.path} />`;
  if ((r.area === 'app' || r.area === 'dev' || r.area === 'onboarding') && !s.auth.user) return html`<${LoginScreen} />`;
  switch (r.id) {
    case 'login': return html`<${LoginScreen} />`;
    case 'register': return html`<${RegisterScreen} />`;
    case 'dashboard': return html`<${Dashboard} />`;
    case 'new': return html`<${NewDesign} route=${r} />`;
    case 'new-describe': return html`<${NewDescribe} route=${r} />`;
    case 'new-template': return html`<${NewTemplate} route=${r} />`;
    case 'new-blank': return html`<${NewBlank} route=${r} />`;
    case 'new-import': return html`<${NewImport} route=${r} />`;
    case 'workspace': return html`<${Workspace} key=${r.params.id} route=${r} />`;
    default: return html`<${Placeholder} key=${r.path} route=${r} />`;
  }
}
function App() {
  const [, force] = useReducer(x => x + 1, 0);
  useEffect(() => Store.sub(force), []);
  const s = S();
  const r = s.route;
  useEffect(() => {
    if (r && (r.area === 'app' || r.area === 'dev' || r.area === 'onboarding') && !s.auth.user) {
      Store.set({ authNotice: 'Log in to open ' + r.title + '. Any email works in this prototype.', nextPath: r.path });
      go('/login', { replace: true });
    }
  }, [r && r.path, !!s.auth.user]);
  useEffect(() => {
    let gAt = 0;
    const onKey = (e) => {
      const st = S(), mod = e.ctrlKey || e.metaKey, k = e.key;
      if (mod && k.toLowerCase() === 'k') { e.preventDefault(); setUI({ palette: !st.ui.palette }); return; }
      if (mod && e.shiftKey && k.toLowerCase() === 'd') { e.preventDefault(); setUI({ dev: !st.ui.dev }); return; }
      if (k === 'Escape') {
        if (st.ui.palette) setUI({ palette: false });
        else if (st.ui.shortcuts) setUI({ shortcuts: false });
        else if (st.ui.feedback) setUI({ feedback: false });
        else if (st.ui.userMenu || st.ui.navMenu || st.ui.dev) setUI({ userMenu: false, navMenu: false, dev: false });
        else if ((st.ui.ai || st.ui.help) && !(st.route && st.route.id === 'workspace' && st.route.params.tab === 'edit')) setUI({ ai: false, help: false });
        return;
      }
      if (isTyping(document.activeElement) || mod || e.altKey) return;
      if (st.ui.palette || st.ui.shortcuts || st.ui.feedback || st.ui.system === 'session') return;
      if (k === '?') { setUI({ shortcuts: true }); return; }
      if (k === '.') { if (st.auth.user) setUI({ ai: !st.ui.ai, help: false }); return; }
      if (gAt && Date.now() - gAt < 1200) { gAt = 0; if (k === 'd') { go('/dashboard'); return; } if (k === 'n') { go('/new'); return; } }
      if (k === 'g') { gAt = Date.now(); return; }
      const rr = st.route;
      if (rr && rr.id === 'workspace' && !st.ui.system) {
        if (k === 'r' || k === 'R') { Actions.runTest(rr.params.id); return; }
        if (k >= '1' && k <= '4') { go('/designs/' + rr.params.id + '/' + WS_TABS[+k - 1].id); return; }
      }
    };
    const onDown = (e) => {
      const st = S();
      if ((st.ui.userMenu || st.ui.navMenu) && !e.target.closest('.menu-wrap')) setUI({ userMenu: false, navMenu: false });
      if (st.ui.dev && !e.target.closest('.devmenu') && !e.target.closest('.devfab')) setUI({ dev: false });
    };
    window.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', onDown);
    return () => { window.removeEventListener('keydown', onKey); document.removeEventListener('mousedown', onDown); };
  }, []);
  const isWs = r && r.id === 'workspace';
  return html`<div class="shell">
    <${TopBar} />
    <main class="main" id="main" style=${isWs ? 'overflow:hidden' : ''}>${pickScreen(s)}</main>
    ${s.ui.ai && s.auth.user && html`<${AIPanel} />`}
    ${s.ui.help && !s.ui.ai && html`<${HelpDrawer} />`}
    ${s.ui.palette && html`<${CommandPalette} />`}
    ${s.ui.shortcuts && html`<${ShortcutsSheet} />`}
    ${s.ui.feedback && html`<${FeedbackModal} />`}
    ${s.ui.system === 'session' && html`<${SessionModal} />`}
    <${Toasts} />
    <${DevSwitcher} />
  </div>`;
}

(function boot() {
  Store.init(initialState());
  applyTheme();
  let start = null;
  try { start = hashToPath(location.hash); } catch (e) { start = null; }
  go(start || '/dashboard', { replace: true });
  window.addEventListener('hashchange', () => {
    if (location.hash === suppressHash) { suppressHash = null; return; }
    const p = hashToPath(location.hash);
    if (p && (!S().route || p !== S().route.path)) go(p);
  });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Store.set(st => Object.assign({}, st))); } catch (e) { /* older browsers */ }
  render(html`<${App} />`, document.getElementById('app'));
})();

</script>
