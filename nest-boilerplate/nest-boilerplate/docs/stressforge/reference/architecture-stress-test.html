<title>Architecture Stress Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout: a test bench. A control strip on top, the graph-paper rig in
   the middle, instrument readouts around the edges. Accent is cobalt
   "ink"; green / amber / red are reserved for component health.
   ===================================================================== */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --sunken: #E8ECF1;
  --canvas: #F7F9FB;
  --ink: #111722;
  --ink-2: #3E4858;
  --ink-3: #5E6979;
  --ink-4: #8C96A5;
  --line: #D4DAE2;
  --line-soft: #E4E8EE;
  --line-strong: #B9C2CE;
  --edge: #97A2B1;
  --grid-minor: rgba(40, 66, 130, 0.065);
  --grid-major: rgba(40, 66, 130, 0.13);
  --accent: #2446D2;
  --accent-hover: #1B38B0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9FB;
  --accent-line: #AEBBF0;
  --ok: #1E9A61;
  --ok-ink: #12744A;
  --ok-soft: #DEF2E7;
  --warn: #D99A12;
  --warn-ink: #8A5A00;
  --warn-soft: #FBF0D4;
  --fail: #D63B2B;
  --fail-ink: #B1271B;
  --fail-soft: #FBE3DF;
  --scrim: rgba(12, 16, 24, 0.36);
  --shadow: 0 1px 2px rgba(17, 23, 34, .06), 0 6px 20px rgba(17, 23, 34, .07);
  --shadow-lg: 0 2px 6px rgba(17, 23, 34, .08), 0 24px 60px rgba(17, 23, 34, .18);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-sm: 4px; --r: 6px; --r-lg: 10px;
  --topbar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F15; --surface: #121821; --sunken: #0A0D12; --canvas: #0E131A;
    --ink: #E6EAF0; --ink-2: #B0B9C6; --ink-3: #8691A0; --ink-4: #5D6777;
    --line: #262F3C; --line-soft: #1B222D; --line-strong: #3A4556; --edge: #556174;
    --grid-minor: rgba(150, 175, 230, 0.05); --grid-major: rgba(150, 175, 230, 0.1);
    --accent: #7D95FF; --accent-hover: #95A9FF; --accent-ink: #08102E; --accent-soft: #19223F; --accent-line: #394A92;
    --ok: #36C384; --ok-ink: #5AD69E; --ok-soft: #10281D;
    --warn: #EFB03A; --warn-ink: #F4C463; --warn-soft: #2B220F;
    --fail: #FF6450; --fail-ink: #FF8B7B; --fail-soft: #331718;
    --scrim: rgba(0, 0, 0, 0.56);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .5), 0 24px 60px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F15; --surface: #121821; --sunken: #0A0D12; --canvas: #0E131A;
  --ink: #E6EAF0; --ink-2: #B0B9C6; --ink-3: #8691A0; --ink-4: #5D6777;
  --line: #262F3C; --line-soft: #1B222D; --line-strong: #3A4556; --edge: #556174;
  --grid-minor: rgba(150, 175, 230, 0.05); --grid-major: rgba(150, 175, 230, 0.1);
  --accent: #7D95FF; --accent-hover: #95A9FF; --accent-ink: #08102E; --accent-soft: #19223F; --accent-line: #394A92;
  --ok: #36C384; --ok-ink: #5AD69E; --ok-soft: #10281D;
  --warn: #EFB03A; --warn-ink: #F4C463; --warn-soft: #2B220F;
  --fail: #FF6450; --fail-ink: #FF8B7B; --fail-soft: #331718;
  --scrim: rgba(0, 0, 0, 0.56);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .5), 0 24px 60px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
#app { height: 100%; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
hr { border: 0; border-top: 1px solid var(--line-soft); margin: 0; }
code, kbd, .mono { font-family: var(--font-mono); }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface); color: var(--ink-2); font-size: 11px; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; align-content: start; }
.stack.lg { gap: 20px; }
.stack.xl { gap: 32px; }
.grow { flex: 1 1 auto; min-width: 0; }
.c-ok { color: var(--ok-ink); } .c-warn { color: var(--warn-ink); } .c-fail { color: var(--fail-ink); } .c-accent { color: var(--accent); }

/* Type scale: 11 / 12.5 / 14 / 16 / 20 / 26 / 34 */
.display { font-family: var(--font-display); font-stretch: 116%; font-weight: 760; letter-spacing: -0.012em; line-height: 1.08; }
.h1 { font-family: var(--font-display); font-stretch: 116%; font-weight: 760; font-size: 30px; letter-spacing: -0.015em; line-height: 1.1; }
.h2 { font-family: var(--font-display); font-stretch: 108%; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; line-height: 1.2; }
.h3 { font-weight: 650; font-size: 15px; line-height: 1.3; }
.lede { font-size: 16px; color: var(--ink-2); max-width: 64ch; }
.eyebrow { font: 600 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.prose { max-width: 66ch; color: var(--ink-2); }
.prose p + p { margin-top: 10px; }

/* =====================================================================
   CONTROLS
   ===================================================================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13px/1 var(--font-body); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, transform .08s; text-decoration: none !important; }
.btn:hover { background: var(--sunken); }
.btn:active { transform: translateY(1px); }
.btn svg { flex: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--sunken); color: var(--ink); }
.btn-danger { color: var(--fail-ink); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; gap: 6px; }
.btn-lg { height: 42px; padding: 0 18px; font-size: 14px; }
.btn-block { width: 100%; }
.btn.icon { width: 34px; padding: 0; }
.btn-sm.icon { width: 28px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 6px; }
.field + .field { margin-top: 14px; }
.label { font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.hint { font-size: 12px; color: var(--ink-3); }
.input, .select, .textarea { width: 100%; height: 36px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 14px var(--font-body); }
.input.sm, .select.sm { height: 30px; font-size: 13px; }
.input.mono { font-family: var(--font-mono); font-size: 13px; }
.textarea { height: auto; padding: 10px 12px; line-height: 1.55; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.bad { border-color: var(--fail); box-shadow: 0 0 0 3px var(--fail-soft); }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--sunken); border: 1px solid var(--line-soft); }
.seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stepper button { width: 30px; height: 30px; border: 0; background: var(--surface); cursor: pointer; color: var(--ink-2); }
.stepper button:hover { background: var(--sunken); }
.stepper input { width: 46px; height: 30px; border: 0; border-inline: 1px solid var(--line); text-align: center; background: var(--surface); color: var(--ink); font: 600 13px var(--font-mono); }
.stepper input:focus { outline: none; background: var(--accent-soft); }

/* Pills, chips, meters */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font: 600 11.5px/1 var(--font-body); background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.fail { background: var(--fail-soft); color: var(--fail-ink); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.outline { background: transparent; border: 1px solid var(--line); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font: 600 10.5px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); background: var(--surface); }
.tag.accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.tag.mock { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 12.5px; font-weight: 500; cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent-line); color: var(--ink); }
.meter { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .3s ease; }
.meter.warn > i { background: var(--warn); }
.meter.fail > i { background: var(--fail); }
.meter.idle > i { background: var(--ink-4); }
.sdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink-4); }
.sdot.ok { background: var(--ok); } .sdot.warn { background: var(--warn); } .sdot.fail { background: var(--fail); }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); min-height: 48px; }
.panel-b { padding: 16px; }
.panel-f { padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.paper { background-color: var(--canvas); background-image: linear-gradient(var(--grid-minor) 1px, transparent 1px), linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px); background-size: 16px 16px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); background: var(--sunken); color: var(--ink-2); font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn-ink); }
.note.fail { background: var(--fail-soft); color: var(--fail-ink); }
.note.accent { background: var(--accent-soft); color: var(--ink); }
.note svg { flex: none; margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font: 600 10.5px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }
.tbl tr.hl td { background: var(--fail-soft); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--sunken); }
.tbl tr.hl.click:hover td { background: var(--fail-soft); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); }

/* =====================================================================
   SHELL
   ===================================================================== */
.shell { height: 100%; display: grid; grid-template-rows: var(--topbar-h) minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.topbar { position: relative; z-index: 30; display: flex; align-items: center; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none !important; flex: none; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.brand-word { font-family: var(--font-display); font-size: 15px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
.brand-word b { font-stretch: 122%; font-weight: 780; }
.brand-word span { font-stretch: 100%; font-weight: 500; color: var(--ink-3); margin-right: 5px; }
.nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
.nav a { padding: 6px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 550; font-size: 13.5px; text-decoration: none; white-space: nowrap; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunken); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.search-btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-3); font-size: 13px; cursor: pointer; min-width: 180px; margin-right: 6px; }
.search-btn:hover { border-color: var(--line-strong); color: var(--ink-2); }
.search-btn .grow { text-align: left; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 11.5px var(--font-mono); border: 1px solid var(--accent-line); cursor: pointer; }
.menu-wrap { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 50; animation: pop .14s ease; }
.menu.left { left: 0; right: auto; }
.menu a, .menu button.mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 6px; border: 0; background: none; color: var(--ink); font-size: 13.5px; text-align: left; cursor: pointer; text-decoration: none !important; }
.menu a:hover, .menu button.mi:hover { background: var(--sunken); }
.menu .sep { height: 1px; background: var(--line-soft); margin: 6px 4px; }
.menu .mh { padding: 8px 10px 6px; }
.only-wide { display: flex; }
.only-narrow { display: none !important; }
@media (max-width: 1180px) {
  .nav.full { display: none; }
  .only-narrow { display: inline-flex !important; }
  .search-btn { min-width: 0; }
  .search-btn .grow { display: none; }
}
@media (max-width: 720px) {
  .brand-word span { display: none; }
  .hide-sm { display: none !important; }
  .search-btn kbd { display: none; }
  .topbar { gap: 8px; }
}
@media (max-width: 520px) {
  .brand-word { display: none; }
  .topbar-right { gap: 0; }
}
.main { overflow: auto; min-height: 0; position: relative; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page.narrow { max-width: 880px; }
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); margin-bottom: 14px; }
.crumbs a { color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); }
.crumbs svg { opacity: .6; }
.crumbs .cur { color: var(--ink-2); font-weight: 600; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head .stack { gap: 8px; }

/* Drawers, modals, palette, toasts */
.drawer { position: fixed; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); right: 0; bottom: 0; width: min(400px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); z-index: 45; display: flex; flex-direction: column; animation: slideIn .22s cubic-bezier(.2,.8,.2,1); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 16px; border-bottom: 1px solid var(--line); }
.drawer-b { flex: 1; overflow: auto; padding: 16px; min-height: 0; }
.drawer-f { border-top: 1px solid var(--line); padding: 12px; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: start center; padding: 11vh 16px 16px; animation: fade .15s ease; overflow: auto; }
.scrim.center { place-items: center; padding-top: 16px; }
.modal { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); animation: pop .16s ease; min-width: 0; }
.modal.wide { width: min(760px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.modal-b { padding: 16px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
.cmdk-input { width: 100%; height: 52px; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0 16px 0 44px; font-size: 16px; color: var(--ink); }
.cmdk-input:focus { outline: none; }
.cmdk-list { max-height: min(56vh, 460px); overflow: auto; padding: 6px; }
.cmdk-group { padding: 10px 10px 4px; }
.cmdk-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: none; color: var(--ink); font-size: 13.5px; text-align: left; cursor: pointer; }
.cmdk-item .path { margin-left: auto; font: 500 11px var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.cmdk-item[aria-selected="true"] { background: var(--accent-soft); }
.cmdk-item svg { color: var(--ink-3); flex: none; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px 11px 14px; background: var(--ink); color: var(--bg); border-radius: 9px; box-shadow: var(--shadow-lg); animation: toastIn .26s cubic-bezier(.2,.8,.2,1); font-size: 13.5px; }
.toast .ti { flex: none; margin-top: 2px; }

.toast button { background: none; border: 0; color: inherit; opacity: .7; cursor: pointer; padding: 2px; }
.toast .tact { opacity: 1; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.devfab { position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px; border: 1px dashed var(--line-strong); background: var(--surface); color: var(--ink-3); font: 600 10.5px/1 var(--font-mono); letter-spacing: .05em; opacity: .55; cursor: pointer; transition: opacity .15s; }
.devfab:hover, .devfab[aria-expanded="true"] { opacity: 1; }
.devmenu { position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 75; width: 290px; max-height: calc(100% - 120px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 8px; animation: pop .14s ease; }
.devmenu .mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink); font-size: 13px; text-align: left; cursor: pointer; }
.devmenu .mi:hover { background: var(--sunken); }
.devmenu .mi .code { margin-left: auto; font: 500 10.5px var(--font-mono); color: var(--ink-3); }
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateY(-4px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: 0; } }
.spin { animation: spin .9s linear infinite; }
.caret::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); margin-left: 1px; }

/* AI assistant */

.ai-msg { display: grid; gap: 6px; max-width: 100%; }
.ai-msg .who { font: 600 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.ai-msg .body { font-size: 13.5px; line-height: 1.55; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.ai-msg.user .body { background: var(--sunken); padding: 9px 12px; border-radius: 10px 10px 2px 10px; justify-self: end; max-width: 88%; }
.ai-input { display: flex; gap: 8px; }
.ai-input .input { height: 38px; }

/* =====================================================================
   SCREENS — shared
   ===================================================================== */
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }

@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.readout { background: var(--surface); padding: 13px 16px 14px; min-width: 0; }

/* Placeholder */

/* System states */

.sys-code { display: inline-flex; align-items: center; gap: 8px; }

.progress { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }

.codeblock { margin: 0; padding: 12px 14px; border-radius: var(--r); background: var(--sunken); color: var(--ink-2); font: 12px/1.6 var(--font-mono); overflow-x: auto; white-space: pre; }

/* Auth */
.auth { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.auth-form { display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.auth-side svg.topo { width: 100%; max-width: 520px; height: auto; }
.oauth { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; margin: 18px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.strength { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.strength i { height: 4px; border-radius: 2px; background: var(--sunken); }
@media (max-width: 900px) { .auth { grid-template-columns: minmax(0, 1fr); } .auth-side { display: none; } }

/* Dashboard */
.dash-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.dcard { display: grid; grid-template-rows: 128px auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; color: var(--ink); text-decoration: none !important; transition: border-color .15s, box-shadow .15s, transform .15s; min-width: 0; }

.dcard .thumb > svg { width: 100%; height: 100%; }
.dcard .meta { padding: 12px 14px 14px; display: grid; gap: 8px; min-width: 0; }
.dcard .name { font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.attention { display: grid; gap: 8px; }
.att-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.att-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Workspace */
.ws { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.ws-head, .ws-body { min-width: 0; }
.ws-head { background: var(--surface); border-bottom: 1px solid var(--line); padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ws-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.ws-name { font-family: var(--font-display); font-stretch: 110%; font-weight: 720; font-size: 19px; letter-spacing: -0.01em; border: 1px solid transparent; border-radius: 5px; padding: 1px 5px; margin-left: -6px; background: transparent; color: var(--ink); min-width: 0; max-width: 100%; }
.ws-name:hover { border-color: var(--line); }
.ws-name:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px 11px; color: var(--ink-3); font-weight: 600; font-size: 13.5px; text-decoration: none !important; white-space: nowrap; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .ph-mark { font: 600 9.5px var(--font-mono); color: var(--ink-4); letter-spacing: .04em; }
.ws-body { min-height: 0; overflow: auto; }
.ws-body.fill { overflow: hidden; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.ws-page { max-width: 1320px; margin: 0 auto; padding-block: 22px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Editor */
.ed { height: 100%; display: grid; grid-template-columns: 208px minmax(0, 1fr) 304px; grid-template-rows: minmax(0, 1fr) auto; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.ed-palette { grid-row: 1 / 3; border-right: 1px solid var(--line); overflow: auto; padding: 12px 10px 48px; display: grid; gap: 14px; align-content: start; }
.ed-canvas { position: relative; min-width: 0; min-height: 0; }
.ed-props { grid-column: 3; grid-row: 1 / 3; border-left: 1px solid var(--line); overflow: auto; min-width: 0; }
.ed-live { grid-column: 2; grid-row: 2; border-top: 1px solid var(--line); min-width: 0; }
.ed-narrow { display: none; }
.pal-group { display: grid; gap: 4px; }
.pal-item { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 9px; padding: 6px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--ink); text-align: left; cursor: grab; touch-action: none; user-select: none; }
.pal-item:hover { background: var(--sunken); border-color: var(--line-soft); }
.pal-item .gl { width: 32px; height: 32px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line-soft); display: grid; place-items: center; color: var(--ink-2); }
.pal-item .nm { font-weight: 600; font-size: 13px; line-height: 1.2; }
.pal-item .cp { font: 500 10.5px var(--font-mono); color: var(--ink-3); }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%); padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1.5px solid var(--accent); box-shadow: var(--shadow-lg); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
@media (max-width: 1180px) {
  .ed { grid-template-columns: 62px minmax(0, 1fr) 276px; }
  .ed-palette { padding: 10px 6px 48px; }
  .pal-item { grid-template-columns: 1fr; justify-items: center; padding: 4px; }
  .pal-item .txt, .pal-group .eyebrow { display: none; }
}
@media (max-width: 899px) {
  .ed { display: none; }
  .ed-narrow { display: grid; gap: 14px; max-width: 520px; margin: 8vh auto 0; text-align: center; justify-items: center; }
}
.props-sec { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 12px; }
.props-sec:last-child { border-bottom: 0; }
.props-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.props-row .label { font-weight: 600; }
.issue { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 9px 10px; border-radius: 7px; background: var(--sunken); font-size: 12.5px; text-align: left; border: 0; color: var(--ink-2); cursor: pointer; width: 100%; }
.issue.error { background: var(--fail-soft); color: var(--fail-ink); }
.issue.warning { background: var(--warn-soft); color: var(--warn-ink); }
.issue b { color: inherit; display: block; font-weight: 650; }
.issue svg { margin-top: 2px; }
.live { display: flex; align-items: center; gap: 6px 18px; padding: 9px 14px; flex-wrap: wrap; }
.live .ro { display: grid; gap: 1px; min-width: 0; }
.live .ro .k { font: 600 9.5px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.live .ro .v { font: 650 14.5px var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.live .slider { display: grid; grid-template-columns: auto minmax(110px, 200px) auto; gap: 10px; align-items: center; }
.live .sep { width: 1px; align-self: stretch; background: var(--line-soft); }
.coach { position: absolute; left: 12px; top: 60px; width: 250px; z-index: 5; padding: 12px 14px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.coach li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.coach li.done { color: var(--ink-3); text-decoration: line-through; }
.coach ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }

/* Canvas */
.cv { position: absolute; inset: 0; background: var(--canvas); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.cv-svg { width: 100%; height: 100%; display: block; cursor: grab; }
.cv-svg.panning { cursor: grabbing; }
.cv-svg.connecting { cursor: crosshair; }
.cv-grid-minor { stroke: var(--grid-minor); }
.cv-grid-major { stroke: var(--grid-major); }
.cv-node { cursor: pointer; }
.cv-node-body { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; transition: stroke .15s; }
.cv-node:hover .cv-node-body { stroke: var(--ink-4); }
.cv-node.overlay.s-warn .cv-node-body { stroke: var(--warn); stroke-width: 1.5; }
.cv-node.overlay.s-fail .cv-node-body { stroke: var(--fail); stroke-width: 1.75; }
.cv-node.is-sel .cv-node-body { stroke: var(--accent); stroke-width: 2; }
.cv-node.is-src .cv-node-body { stroke: var(--accent); stroke-dasharray: 4 3; stroke-width: 2; }
.cv-node.is-target .cv-node-body { stroke: var(--accent); stroke-width: 2.5; }
.cv-node.dim { opacity: .45; }
.cv-node-icon { fill: var(--sunken); stroke: var(--line-soft); }
.cv-glyph { color: var(--ink-2); }
.cv-node-label { font: 650 13px var(--font-body); fill: var(--ink); }
.cv-node-sub { font: 500 10.5px var(--font-mono); fill: var(--ink-3); }
.cv-pct { font: 700 11.5px var(--font-mono); }
.cv-pct.s-ok { fill: var(--ok-ink); } .cv-pct.s-warn { fill: var(--warn-ink); } .cv-pct.s-fail { fill: var(--fail-ink); } .cv-pct.s-idle { fill: var(--ink-4); }
.cv-meter-bg { fill: var(--sunken); }
.cv-meter.s-ok { fill: var(--ok); } .cv-meter.s-warn { fill: var(--warn); } .cv-meter.s-fail { fill: var(--fail); } .cv-meter.s-idle { fill: var(--ink-4); }
.cv-edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.cv-edge.is-sel { stroke: var(--accent); }
.cv-edge.flow { stroke-dasharray: 7 7; animation: dash var(--dur, 1.4s) linear infinite; }
.cv-edge.bad { stroke: var(--fail); stroke-dasharray: 3 4; }
.cv-edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.cv-edge-label { font: 600 10px var(--font-mono); fill: var(--ink-3); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.cv-arrow { fill: var(--edge); }
.cv-arrow-sel { fill: var(--accent); }
.cv-temp { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 5 4; }
.cv-port { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; opacity: 0; transition: opacity .15s, fill .15s; cursor: crosshair; }
.cv-port:hover { fill: var(--accent); stroke: var(--accent); }
.cv-node:hover .cv-port, .cv-node.is-sel .cv-port, .cv-svg.connecting .cv-port { opacity: 1; }
.cv-port.in { cursor: default; pointer-events: none; }
.cv-bneck { fill: none; stroke: var(--fail); stroke-width: 2; animation: pulse 1.6s ease-in-out infinite; }
.cv-bneck-tag rect { fill: var(--fail); }
.cv-bneck-tag text { font: 700 9.5px var(--font-mono); letter-spacing: .06em; fill: #fff; }
@keyframes dash { to { stroke-dashoffset: -28; } }
@keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.cv-tools { position: absolute; left: 12px; top: 12px; z-index: 4; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); flex-wrap: wrap; max-width: calc(100% - 24px); }
.cv-tools .btn { height: 30px; }
.cv-tools .btn.icon { width: 30px; }
.cv-tools .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.cv-tools .vsep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.cv-zoom { font: 600 11px var(--font-mono); color: var(--ink-3); min-width: 42px; text-align: center; }
.cv-mini { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 172px; height: 110px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; }
.cv-mini rect.vp { fill: var(--accent-soft); fill-opacity: .5; stroke: var(--accent); stroke-width: 1.2; }
.cv-mini rect.mn { fill: var(--line-strong); }
.cv-mini rect.mn.s-ok { fill: var(--ok); } .cv-mini rect.mn.s-warn { fill: var(--warn); } .cv-mini rect.mn.s-fail { fill: var(--fail); }
.cv-empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.cv-empty > div { text-align: center; max-width: 340px; display: grid; gap: 8px; justify-items: center; color: var(--ink-3); }
.cv-legend { position: absolute; left: 12px; bottom: 12px; z-index: 4; display: flex; gap: 12px; padding: 6px 10px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); font: 600 10.5px var(--font-mono); color: var(--ink-3); }
.cv-legend span { display: inline-flex; align-items: center; gap: 5px; }

/* Results */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 20px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); }
.verdict.fail { background: var(--fail-soft); border-color: color-mix(in srgb, var(--fail) 35%, transparent); }
.verdict.strained { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.verdict.pass { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.verdict .vglyph { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); }
.verdict.fail .vglyph { color: var(--fail-ink); } .verdict.strained .vglyph { color: var(--warn-ink); } .verdict.pass .vglyph { color: var(--ok-ink); }
.verdict .vt { font-family: var(--font-display); font-stretch: 112%; font-weight: 760; font-size: 22px; line-height: 1.15; letter-spacing: -0.01em; }
.verdict.fail .vt { color: var(--fail-ink); } .verdict.strained .vt { color: var(--warn-ink); } .verdict.pass .vt { color: var(--ok-ink); }

        tb.a.forEach(call => call.forEach(({ to, p }) => { const amt = l.a * p * s; if (amt > 0) { L[to].a += amt; flow(id, to, amt); } }));

  /* ---------- 1.7 Per-component latency (M/M/c, Sakasegawa) ---------- */

  /* ---------- 1.8 Request path walk ---------- */
  function compress(list, max) {

  /* ---------- 1.9 Lognormal mixture percentiles ---------- */

  /* ---------- 1.10 Queue backlog ---------- */
  function queueStats(design, g, P, traffic) {

  /* ---------- 1.11 simulate() — one steady-state test at a given load ---------- */
  function simulate(design, trafficIn, opts) {
    opts = opts || {};
    const traffic = normTraffic(trafficIn || design.traffic);
    const R = opts.rps != null ? Math.max(0, opts.rps) : traffic.rps;
    const shedding = opts.shedding !== false;
    const validation = validate(design);
    if (!validation.ok) return { ok: false, validation, rps: R, traffic };
    const g = graph(design);
    const order = topoOrder(design.nodes, g.out, g.inn);
    const tables = routingTables(design, g);
    const P = propagate(design, g, tables, order, traffic, R, shedding);
    const model = {};
    design.nodes.forEach(n => { model[n.id] = nodeModel(n, P.st[n.id]); });

    // Request mixture across clients and request kinds
    const clients = design.nodes.filter(n => n.type === 'client');
    const shareTot = clients.reduce((s, c) => s + Math.max(0, num(propsOf(c).share, 1)), 0) || 1;
    const walk = makeWalker(g, tables, model, false);
    let comps = [];
    clients.forEach(c => {
      const sh = Math.max(0, num(propsOf(c).share, 1)) / shareTot;

    const queues = queueStats(design, g, P, traffic);
    queues.forEach(q => {
      q.syncShare = R > 0 ? P.L[q.id].w / R : 0;
      errorRate += q.syncShare * q.overflow;
    });
    errorRate = Math.max(0, Math.min(1, errorRate));

    // Effective region: a CDN edge sits next to whoever calls it.
    const eff = {};
    order.forEach(id => {
      const n = g.byId[id];

    });

    // Per-component summary
    const nodes = design.nodes.map(n => {
      const s = P.st[n.id], m = model[n.id], l = s.load;

        id: n.id, type: n.type, label: n.label, region: eff[n.id],
        reads: l.r, writes: l.w, async: l.a, peak: s.peak, cap: s.cap, rho: s.rho, status,
        background: n.type !== 'client' && (l.r + l.w) === 0 && l.a > 0,
        T: m.T, S: m.S, Wq: m.Wq, servers: m.c, errors: n.type === 'replica' && l.w > 0 ? Math.max(m.e, 1) : m.e,

    // components (behind a queue) only count when nothing on the request path is busy.
    const byRho = (a, b) => b.rho - a.rho;

    const bgTop = live.filter(n => n.background).sort(byRho)[0] || null;

    const backgroundIssues = live.filter(n => n.background && n.rho >= 1).map(n => ({ id: n.id, label: n.label, rho: n.rho, dropped: 1 - 1 / n.rho }));

      p50, p95, p99, mean, errorRate, throughput: R * (1 - errorRate),
      sloMet, verdict, nodes, byId: nodes.reduce((acc, n) => { acc[n.id] = n; return acc; }, {}),

  }

  /* ---------- 1.12 Named request paths (for "how requests travel") ---------- */

    const v = validate(design);
    if (!v.ok) return [];
    const R = opts.rps != null ? opts.rps : traffic.rps;
    const g = graph(design);
    const order = topoOrder(design.nodes, g.out, g.inn);
    const tables = routingTables(design, g);
    const P = propagate(design, g, tables, order, traffic, R, true);
    const model = {};
    design.nodes.forEach(n => { model[n.id] = nodeModel(n, P.st[n.id]); });
    const walk = makeWalker(g, tables, model, true);
    const clients = design.nodes.filter(n => n.type === 'client');
    const shareTot = clients.reduce((s, c) => s + Math.max(0, num(propsOf(c).share, 1)), 0) || 1;

    clients.forEach(c => {
      const sh = Math.max(0, num(propsOf(c).share, 1)) / shareTot;

    });

      steps: o.seq.map(x => ({ id: x.id, label: g.byId[x.id].label, type: g.byId[x.id].type, hop: x.hop, T: model[x.id].T }))
    }));
  }

  /* ---------- 1.13 findLimits() — ramp until the design breaks ---------- */
  function findLimits(design, trafficIn) {
    const traffic = normTraffic(trafficIn || design.traffic);
    const validation = validate(design);
    if (!validation.ok) return { ok: false, validation };
    const isBroken = (r) => { const s = simulate(design, traffic, { rps: r }); return { b: s.errorRate > traffic.errorBudget || s.p95 > traffic.sloP95, s }; };

    const R0 = 100;
    const demand = simulate(design, traffic, { rps: R0, shedding: false });
    const order = demand.nodes.filter(n => n.type !== 'client' && n.rho > 0)
      .map(n => ({ id: n.id, label: n.label, type: n.type, satRps: R0 / n.rho }))
      .sort((a, b) => a.satRps - b.satRps);
    const floor = isBroken(1);

      return Object.assign(base, { breakRps: 0, floor: true, cause: floor.s.p95 > traffic.sloP95 ? 'latency' : 'errors', at: floor.s, firstId: floor.s.bottleneck ? floor.s.bottleneck.id : null, curve: rampCurve(design, traffic, Math.max(traffic.rps * 1.3, 100)), headroom: 0 });
    }

      return Object.assign(base, { breakRps: Infinity, cause: null, at: null, firstId: order[0] ? order[0].id : null, curve: rampCurve(design, traffic, traffic.rps * 4), headroom: Infinity });
    }
    for (let i = 0; i < 24; i++) { const mid = Math.sqrt(lo * hi); if (isBroken(mid).b) hi = mid; else lo = mid; }

  }

  /* ---------- 1.14 timeline() — per-interval metrics for the strip chart ---------- */

    const flat = Object.assign({}, traffic, { burst: 1 });
    for (let i = 0; i < N; i++) {

  /* ---------- 1.15 Design edit helpers (used by suggestions and the AI draft) ---------- */
  const NODE_W = 184, NODE_H = 64;

    return (prefix || 'n') + (max + 1);
  }

    const id = nextId(design, 'n');
    const sameType = design.nodes.filter(n => n.type === type).length;
    const node = Object.assign({ id, type, label: CATALOG[type].label + (sameType ? ' ' + (sameType + 1) : ''), x: Math.round(x), y: Math.round(y), props: {} }, extra || {});

    return e;

    return { x, y };
  }

  /* ---------- 1.16 suggest() — scripted "AI" fixes chosen by the real bottleneck ---------- */
  function suggest(design, trafficIn) {
    const traffic = normTraffic(trafficIn || design.traffic);
    const sim = simulate(design, traffic);
    if (!sim.ok) return [];
    const g = graph(design);
    const out = [];
    const b = sim.bottleneck;
    const fmt = (v) => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v));
    const callers = (id, types) => g.inn[id].map(k => g.byId[k]).filter(n => !types || types.indexOf(n.type) !== -1);
    const push = (s) => { if (!out.some(o => o.id === s.id)) out.push(s); };
    if (b) {
      const bn = g.byId[b.id];
      const pct = Math.round(b.rho * 100);
      const readShare = (b.reads + b.writes + b.async) > 0 ? b.reads / (b.reads + b.writes + b.async) : 0;
      if (b.type === 'db') {
        const apps = callers(b.id, ['app', 'worker']);
        const hasCache = apps.some(a => g.out[a.id].some(k => g.byId[k].type === 'cache'));
        if (readShare >= 0.5 && !hasCache && apps.length) push({ id: 'add-cache', title: 'Put a cache in front of ' + bn.label, why: bn.label + ' is at ' + pct + '% and ' + Math.round(readShare * 100) + '% of its load is reads. A cache with an 80% hit rate answers most of them from memory.', apply: (d) => { const p = freeSpot(d, (apps[0].x + bn.x) / 2, bn.y - 110); const c = addNode(d, 'cache', p.x, p.y); apps.forEach(a => addEdge(d, a.id, c.id)); return d; } });

/* ---------- AI assistant (scripted, no model is called) ---------- */
function scriptedReply(q, d) {
  const t = q.toLowerCase();
  const sim = d ? simOf(d) : null;
  if (d && sim && !sim.ok) {
    const e0 = sim.validation.errors[0];
    return '“' + d.name + '” can’t be simulated yet. ' + e0.msg + ' ' + e0.fix;
  }
  const b = sim && sim.bottleneck;
  if (/p95|p99|percentile|tail/.test(t)) {
    let a = 'p95 is the latency that 95 out of 100 requests beat. The slowest 5% are what users notice, so it is a better target than the average.';
    if (sim) {
      const ps = pathsOf(d);
      const slow = ps.slice().sort((x, y) => y.mean - x.mean)[0];
      a += '\n\nIn “' + d.name + '” at ' + fmt.int(sim.rps) + ' rps: p50 is ' + fmt.ms(sim.p50) + ', p95 is ' + fmt.ms(sim.p95) + ' and p99 is ' + fmt.ms(sim.p99) + '.';
      if (slow) a += ' The slow tail comes from ' + slow.kind.toLowerCase() + 's that go ' + slow.steps.map(x => x.label).join(' → ') + ' (' + fmt.pct(slow.p) + ' of requests, about ' + fmt.ms(slow.mean) + ' each).';
    }
    return a;
  }
  if (/cache|redis|hit/.test(t)) {
    const c = d && d.nodes.find(n => n.type === 'cache');
    if (c && sim) { const hr = E.propsOf(c).hitRatio; return '“' + c.label + '” answers ' + Math.round(hr * 100) + '% of reads from memory in about 1 ms. Only misses reach the database, so the database sees ' + Math.round((1 - hr) * 100) + '% of read traffic.\n\nTry it: select the cache on the Edit tab and drag the hit-rate slider down. Watch the database turn amber.'; }
    return 'A cache keeps hot data in memory. With an 80% hit rate, 4 of every 5 reads never touch the database, which is often the cheapest way to raise a design’s breaking point.' + (d ? '\n\n“' + d.name + '” has no cache. Drag one from the palette and connect your app servers to it.' : '');
  }
  if (/queue|kafka|async|burst|worker/.test(t)) {
    const qs = sim && sim.queues[0];
    let a = 'A queue accepts work immediately and lets workers process it at their own pace. Bursts fill the queue instead of hitting the database all at once. The cost is lag: the work finishes later.';
    if (qs) a += '\n\nHere, “' + qs.label + '” receives ' + fmt.rps(qs.arrival) + ' jobs/s and workers drain ' + fmt.rps(qs.drain) + '/s. ' + (qs.state === 'growing' ? 'That backlog grows for the whole test, so add workers.' : qs.state === 'absorbing' ? 'Bursts build a backlog that clears in about ' + Math.round(qs.lag) + ' s.' : 'Workers keep up, so there is almost no lag.');
    return a;
  }
  if (/replica|read only|read-only/.test(t)) return 'A read replica is a read-only copy of the primary. It takes a share of reads, but it replays every write too, so it does not help a write-heavy database.' + (b && b.type === 'db' ? '\n\n' + b.label + ' is the bottleneck at ' + fmt.util(b.rho) + '. Reads are ' + fmt.pct(b.reads / Math.max(1e-9, b.reads + b.writes + b.async), 0) + ' of its load.' : '');
  if (/region|far|distance|asia|europe/.test(t) || (sim && sim.crossRegion.length && /slow|latency/.test(t))) {
    if (sim && sim.crossRegion.length) { const x = sim.crossRegion[0]; return 'Some calls cross regions: ' + fmt.region(x.fromRegion) + ' to ' + fmt.region(x.toRegion) + ' adds about ' + x.rtt + ' ms per round trip, even at low load. No amount of scaling fixes distance; moving the servers next to the users does.'; }
    return 'Each component has a region. A call between regions adds a round trip: about 75 ms US East to EU West and 190 ms US East to Asia South. Utilization doesn’t change that, only placement does.';
  }
  if (d && /break|limit|how much|how many|capacity|2x|double|10x|headroom|survive/.test(t)) {
    const L = limitsOf(d);
    if (!L.ok) return 'The limits finder needs a valid design first.';
    if (L.breakRps === Infinity) return '“' + d.name + '” didn’t break even at very high traffic in this model. Check that the components you expect to be busy are connected.';
    if (L.breakRps === 0) return '“' + d.name + '” misses its SLO even with almost no traffic, so the problem is latency, not capacity. ' + (sim.crossRegion.length ? 'Cross-region calls are the likely cause.' : '');
    const first = L.order[0];
    return '“' + d.name + '” breaks at about ' + fmt.int(L.breakRps) + ' rps, which is ' + (L.headroom >= 1 ? L.headroom.toFixed(1) + '× your current traffic' : 'below your current traffic') + '. It fails on ' + (L.cause === 'errors' ? 'error rate' : L.cause === 'latency' ? 'p95 latency' : 'both latency and errors') + '.\n\nThe first component to reach 100% is ' + (first ? first.label + ' at ' + fmt.int(first.satRps) + ' rps' : 'none') + '. The Limits tab shows the full failure order.';
  }
  if (d && /bottleneck|why|fail|fix|improve|what should|suggest|help me/.test(t)) {
    const sg = suggestOf(d);
    let a = b ? 'The bottleneck is ' + b.label + ' at ' + fmt.util(b.rho) + ' utilization (ρ). ' : 'Nothing is close to its limit at this traffic. ';
    a += 'Right now p95 is ' + fmt.ms(sim.p95) + ' against a ' + fmt.ms(d.traffic.sloP95) + ' target, with ' + fmt.pct(sim.errorRate) + ' errors.';
    if (sg[0]) a += '\n\nSuggested fix: ' + sg[0].title + '. ' + sg[0].why + (sg[0].result ? ' In the simulator that moves p95 from ' + fmt.ms(sg[0].before.p95) + ' to ' + fmt.ms(sg[0].result.p95) + '.' : '') + '\n\nApplying fixes from here arrives with the Improve tab in phase 3.';
    return a;
  }
  if (d) {
    return '“' + d.name + '” has ' + d.nodes.length + ' components. At ' + fmt.int(sim.rps) + ' rps (×' + d.traffic.burst + ' bursts) it ' + (sim.verdict === 'fail' ? 'breaks' : sim.verdict === 'strained' ? 'passes, but with little headroom' : 'passes comfortably') + ': p95 ' + fmt.ms(sim.p95) + ', ' + fmt.pct(sim.errorRate) + ' errors' + (b ? ', bottleneck ' + b.label + ' at ' + fmt.util(b.rho) : '') + '.\n\nAsk me why it breaks, how much traffic it can take, or what p95 means.';
  }
  return 'I can explain results and suggest fixes for the design you have open. Open a design from the dashboard and ask “why is it slow?” or “how much traffic can it take?”.\n\nI can also explain concepts: p95, caching, queues, read replicas and regions.';
}

function VerdictPill({ v, sm }) {
  if (!v) return html`<span class="pill">Not run</span>`;
  return html`<span class=${'pill ' + verdictClass[v]}><span class="dot"></span>${v === 'fail' ? 'Breaks' : v === 'strained' ? 'Strained' : 'Passes'}${sm ? '' : ' target'}</span>`;
}
function StatusPill({ status }) {

// Small topology thumbnail (dashboard cards, templates, AI draft preview)
function Thumb({ design, sim, pad }) {
  const nodes = design.nodes || [];
  if (!nodes.length) return html`<div class="muted small">Empty canvas</div>`;
  const W = E.NODE_W, H = E.NODE_H;
  pad = pad == null ? 30 : pad;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min.apply(null, xs) - pad, minY = Math.min.apply(null, ys) - pad;
  const w = Math.max.apply(null, xs) + W + pad - minX, h = Math.max.apply(null, ys) + H + pad - minY;
  const by = {};
  nodes.forEach(n => { by[n.id] = n; });
  const st = (id) => (sim && sim.ok && sim.byId[id]) ? sim.byId[id].status : 'idle';
  return html`<svg width="100%" height="100%" viewBox=${minX + ' ' + minY + ' ' + w + ' ' + h} preserveAspectRatio="xMidYMid meet" role="img" aria-label=${'Diagram of ' + design.name}>
    ${(design.edges || []).map(e => {
      const a = by[e.from], b = by[e.to];
      if (!a || !b) return null;
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, dx = Math.max(40, Math.abs(x2 - x1) / 2);
      return html`<path class="th-edge" d=${'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2} />`;
    })}
    ${nodes.map(n => html`<g class=${'th-node s-' + st(n.id)} transform=${'translate(' + n.x + ' ' + n.y + ')'}>
      <rect width=${W} height=${H} rx="10" />
      <g class="th-glyph"><${Glyph} type=${n.type} s=${34} x=${14} y=${15} /></g>
      <rect class="th-line" x="62" y="22" width=${Math.min(100, 30 + (n.label || '').length * 5)} height="8" rx="4" />
      <rect class="th-line2" x="62" y="38" width="56" height="7" rx="3.5" />
    </g>`)}
  </svg>`;
}

function SystemScreen({ kind, path, fromDev }) {
  const s = S();
  const [busy, setBusy] = useState(false);
  const [prog, setProg] = useState(0);
  const [showRaw, setShowRaw] = useState(false);
  useEffect(() => {
    if (kind !== 'waking') return;
    const t0 = Date.now(), dur = 7000;
    const iv = setInterval(() => {
      const p = Math.min(1, (Date.now() - t0) / dur);
      setProg(p);
      if (p >= 1) { clearInterval(iv); Actions.closeSystem(); Actions.toast('The server is awake. Everything is back to normal speed.', 'ok'); }
    }, 120);
    return () => clearInterval(iv);
  }, [kind]);
  const retry = (msg) => { setBusy(true); setTimeout(() => { setBusy(false); Actions.closeSystem(); if (msg) Actions.toast(msg, 'ok'); }, 1300); };
  const home = s.auth.user ? '/dashboard' : '/';
  const firstDesign = s.order[0];
  const leave = fromDev && html`<button class="btn btn-ghost" onClick=${Actions.closeSystem}>Leave this demo state</button>`;
  const meta = SYSTEM_STATES.find(x => x.id === kind) || { code: '', icon: 'alert' };
  let tone = '', title = '', body = null, detail = null, actions = null;
  switch (kind) {
    case '404': {
      const p = path || (s.route && s.route.path) || '/';
      const seg = p.split('/').filter(Boolean)[0] || '';
      const near = ROUTES.filter(r => !r._c.keys.length && !REDIRECTS[r.id] && seg && r.p.indexOf(seg.slice(0, 4)) !== -1).slice(0, 3);
      title = 'There is no screen at this address.';
      body = html`<p class="lede">Nothing matches <code>${p}</code>. The link may be mistyped, or the page was renamed.</p>`;
      detail = html`<div class="panel sys-detail stack"><div class="eyebrow">Try instead</div><div class="row tight">
        ${(near.length ? near : ROUTES.filter(r => ['dashboard', 'new', 'learn'].indexOf(r.id) !== -1)).map(r => html`<${Link} to=${r.p} cls="chip">${r.title}<//>`)}
      </div></div>`;
      actions = html`<${Link} to=${home} cls="btn btn-primary">${s.auth.user ? 'Go to the dashboard' : 'Go to the home page'}<//><button class="btn" onClick=${() => setUI({ palette: true })}><${Icon} n="search" /> Search all screens</button>`;
      break;
    }
    case '403': {
      tone = 'warn';
      const id = (s.route && s.route.params && s.route.params.id) || 'acme-legacy';
      title = 'This design belongs to another account.';
      body = html`<p class="lede">You are logged in as ${s.auth.user ? s.auth.user.email : 'a guest'}. Ask the owner to share a read-only link, or open one of your own designs.</p>`;
      detail = html`<div class="panel sys-detail"><dl class="kv"><dt>Design</dt><dd>${FOREIGN_DESIGNS[id] || id}</dd><dt>Owner</dt><dd>another account</dd><dt>Your access</dt><dd>none</dd></dl></div>`;
      actions = html`<${Link} to=${home} cls="btn btn-primary">Back to your designs<//><button class="btn" onClick=${() => Actions.toast('Access request recorded. In the real product the owner gets an email.', 'ok')}>Request access</button>`;
      break;
    }
    case '500':
      tone = 'fail';
      title = 'Something broke on our side.';
      body = html`<p class="lede">The server hit an error while loading this page. Your designs are safe and nothing was lost.</p>`;
      detail = html`<div class="panel sys-detail"><dl class="kv"><dt>Reference</dt><dd>req_7f3a2c91</dd><dt>When</dt><dd>${new Date().toISOString().slice(0, 19).replace('T', ' ')} UTC</dd></dl><p class="hint" style="margin-top:10px">If it keeps happening, send feedback and include the reference.</p></div>`;
      actions = html`<button class="btn btn-primary" onClick=${() => retry('Loaded on the second try.')} disabled=${busy}>${busy ? html`<${Icon} n="refresh" cls="spin" /> Retrying…` : html`<${Icon} n="refresh" /> Try again`}</button><button class="btn" onClick=${() => setUI({ feedback: true })}>Send feedback</button>`;
      break;
    case 'waking': {
      tone = 'accent';
      const steps = ['Starting the API container', 'Connecting to the database', 'Warming up the simulation worker'];
      const at = Math.min(steps.length - 1, Math.floor(prog * steps.length));
      title = 'Waking up the server.';
      body = html`<p class="lede">The backend runs on a free hosting tier that sleeps after 15 minutes without traffic. The first request takes 20 to 40 seconds; this demo shortens it to 7.</p>`;
      detail = html`<div class="panel sys-detail stack">
        <div class="progress"><i style=${'width:' + Math.round(prog * 100) + '%'}></i></div>
        <ol class="ph-list">${steps.map((x, i) => html`<li><${Icon} n=${i < at || prog >= 1 ? 'check' : i === at ? 'refresh' : 'clock'} s=${14} cls=${i === at && prog < 1 ? 'spin' : ''} /><span class=${i > at ? 'muted' : ''}>${x}</span></li>`)}</ol>
      </div>`;
      actions = html`<button class="btn" onClick=${Actions.closeSystem}>Keep working while it starts</button>`;
      break;
    }
    case 'quota': {
      tone = 'warn';
      const now = new Date(), reset = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1));
      const mins = Math.round((reset - now) / 60000);
      title = 'You have used all ' + s.ai.limit + ' AI calls for today.';
      body = html`<p class="lede">AI drafts, suggestions and the assistant pause until the quota resets at 00:00 UTC, in ${Math.floor(mins / 60)} h ${mins % 60} min. The simulator, the editor and the limits finder don’t use AI and keep working.</p>`;
      detail = html`<div class="panel sys-detail stack"><div class="row between"><span class="label">AI calls today</span><span class="mono num">${s.ai.limit} / ${s.ai.limit}</span></div><div class="meter fail"><i style="width:100%"></i></div><p class="hint">The quota keeps the product free to run. Rule-based suggestions don’t count against it.</p></div>`;
      actions = html`<${Link} to=${firstDesign ? '/designs/' + firstDesign + '/results' : home} cls="btn btn-primary">Back to results<//><${Link} to="/settings/ai-usage" cls="btn">See AI usage<//>`;
      break;
    }
    case 'simfail': {
      tone = 'fail';
      title = 'The simulation could not run.';
      body = html`<p class="lede">The design has a problem the simulator cannot model, so no numbers were produced. Nothing about your design was changed.</p>`;
      detail = html`<div class="panel sys-detail stack"><div class="eyebrow">Example of what the validator reports</div>
        <div class="issue error"><${Icon} n="xcircle" s=${14} /><div><b>Cycle found: App servers → Database → App servers.</b>Requests would loop forever. Delete one of these edges.</div></div>
        <div class="issue warning"><${Icon} n="alert" s=${14} /><div><b>Queue has no workers.</b>Messages pile up and are never processed. Connect a Worker to it.</div></div>
        <p class="hint">The same check runs on every Results and Limits view. Draw a cycle on the canvas to see it happen for real.</p></div>`;
      actions = html`${firstDesign && html`<${Link} to=${'/designs/' + firstDesign + '/edit'} cls="btn btn-primary">Open the editor<//>`}`;
      break;
    }
    case 'aiinvalid': {
      tone = 'fail';
      const bad = AI.invalidDraft();
      title = 'The AI draft did not pass validation.';
      body = html`<p class="lede">The model returned a design that doesn’t match the schema, so nothing was applied to your canvas. Every AI output is checked before it can change a design.</p>`;
      detail = html`<div class="panel sys-detail stack"><div class="row between"><span class="eyebrow">Schema errors (${bad.errors.length})</span><span class="tag mock">Mock output</span></div>
        ${bad.errors.map(e => html`<div class="issue error"><${Icon} n="xcircle" s=${14} /><div class="mono" style="font-size:12px">${e}</div></div>`)}
        <button class="btn btn-ghost btn-sm" style="justify-self:start" onClick=${() => setShowRaw(!showRaw)}><${Icon} n=${showRaw ? 'chevD' : 'chevR'} s=${14} /> ${showRaw ? 'Hide' : 'Show'} the raw output</button>
        ${showRaw && html`<pre class="codeblock">${bad.raw}</pre>`}</div>`;
      actions = html`<button class="btn btn-primary" disabled=${busy} onClick=${() => retry('The second draft passed validation.')}>${busy ? html`<${Icon} n="refresh" cls="spin" /> Asking again…` : 'Try again'}</button><button class="btn" onClick=${() => { Actions.closeSystem(); go('/new/template'); }}>Start from a template instead</button>`;
      break;
    }
    case 'maintenance':
      tone = 'accent';
      title = 'Scheduled maintenance until 02:30 UTC.';
      body = html`<p class="lede">We are upgrading the database. You can open designs and reports, but editing, tests and AI are paused until it finishes.</p>`;
      detail = html`<div class="panel sys-detail"><dl class="kv"><dt>Started</dt><dd>02:00 UTC</dd><dt>Expected end</dt><dd>02:30 UTC</dd><dt>Still works</dt><dd>viewing designs, reports</dd><dt>Paused</dt><dd>edits, tests, AI</dd></dl></div>`;
      actions = html`<button class="btn btn-primary" onClick=${Actions.closeSystem}>View designs read-only</button>`;
      break;
    default:
      title = 'Unknown state';
  }
  return html`<div class="sys">
    <div class="row" style="gap:16px">
      <div class=${'sys-glyph ' + tone}><${Icon} n=${meta.icon} s=${28} /></div>
      <div class="stack" style="gap:6px"><span class="sys-code"><span class="tag">${meta.code}</span>${fromDev && html`<span class="tag mock">Demo state</span>`}</span></div>
    </div>
    <h1 class="sys-title">${title}</h1>
    ${body}
    ${detail}
    <div class="row">${actions}${leave}</div>
  </div>`;
}

      setDrag(Object.assign({}, drag, { x: w.x, y: w.y, over: over ? over.id : null }));
    }
  };
  const onUp = () => {
    if (!drag) return;
    if (drag.kind === 'node' && drag.moved) onMove(drag.id, drag.x, drag.y);
    if (drag.kind === 'connect' && drag.over) onConnect(drag.from, drag.over);
    setDrag(null);
  };
  const onWheel = (e) => {
    if (readOnly && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = svgRef.current.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
  };
  const selNodeId = sel && sel.kind === 'node' ? sel.id : null;
  const selEdgeId = sel && sel.kind === 'edge' ? sel.id : null;
  const src = drag && drag.kind === 'connect' ? byId[drag.from] : null;

  // Minimap geometry
  let miniEl = null;
  if (mini && d.nodes.length && size.w > 0) {
    const vw = { x: -v.x / v.k, y: -v.y / v.k, w: size.w / v.k, h: size.h / v.k };
    const minX = Math.min(vw.x, ...d.nodes.map(n => n.x)), minY = Math.min(vw.y, ...d.nodes.map(n => n.y));
    const maxX = Math.max(vw.x + vw.w, ...d.nodes.map(n => n.x + NW)), maxY = Math.max(vw.y + vw.h, ...d.nodes.map(n => n.y + NH));
    const MW = 172, MH = 110, pad = 6;
    const sc = Math.min((MW - pad * 2) / (maxX - minX), (MH - pad * 2) / (maxY - minY));
    const ox = pad + ((MW - pad * 2) - (maxX - minX) * sc) / 2, oy = pad + ((MH - pad * 2) - (maxY - minY) * sc) / 2;
    const mx = (x) => ox + (x - minX) * sc, my = (y) => oy + (y - minY) * sc;
    const onMini = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const wx = (e.clientX - r.left - ox) / sc + minX, wy = (e.clientY - r.top - oy) / sc + minY;
      setView({ k: v.k, x: size.w / 2 - wx * v.k, y: size.h / 2 - wy * v.k });
    };
    miniEl = html`<div class="cv-mini" title="Minimap: click to move the view"><svg width=${MW} height=${MH} onClick=${onMini} role="img" aria-label="Minimap">
      ${d.nodes.map(n => { const st = overlay && sim && sim.ok && sim.byId[n.id] ? sim.byId[n.id].status : ''; return html`<rect class=${'mn ' + (st ? 's-' + st : '')} x=${mx(n.x)} y=${my(n.y)} width=${Math.max(3, NW * sc)} height=${Math.max(2, NH * sc)} rx="1.5" />`; })}
      <rect class="vp" x=${mx(vw.x)} y=${my(vw.y)} width=${vw.w * sc} height=${vw.h * sc} rx="2" />
    </svg></div>`;
  }

  return html`<div class="cv" ref=${wrapRef}>
    <svg ref=${svgRef} class=${cx('cv-svg', drag && drag.kind === 'pan' && 'panning', (connectMode || (drag && drag.kind === 'connect')) && 'connecting')}
      onPointerDown=${onDown} onPointerMove=${onMovePtr} onPointerUp=${onUp} onPointerCancel=${onUp} onWheel=${onWheel}
      role="application" aria-label=${'Canvas for ' + d.name + '. ' + d.nodes.length + ' components.'}>
      <defs>
        <pattern id=${gid + '-g'} width="120" height="120" patternUnits="userSpaceOnUse">
          <path class="cv-grid-minor" d="M24 0V120M48 0V120M72 0V120M96 0V120M0 24H120M0 48H120M0 72H120M0 96H120" fill="none" stroke-width="1" />
          <path class="cv-grid-major" d="M0 0V120M0 0H120" fill="none" stroke-width="1" />
        </pattern>
        <marker id=${gid + '-a'} viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="cv-arrow" d="M0 1L10 5L0 9z" /></marker>
        <marker id=${gid + '-as'} viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="cv-arrow-sel" d="M0 1L10 5L0 9z" /></marker>
      </defs>
      <g transform=${'translate(' + v.x + ' ' + v.y + ') scale(' + v.k + ')'}>
        <rect x="-6000" y="-6000" width="12000" height="12000" fill=${'url(#' + gid + '-g)'} />
        ${d.edges.map(e => {
          const a = byId[e.from], b = byId[e.to];
          if (!a || !b) return null;
          const g = edgePath(pos(a), pos(b));
          const f = flows[e.from + '>' + e.to] || 0;
          const w = overlay && f > 0 ? 1.4 + 3.4 * Math.sqrt(f / maxFlow) : 1.6;
          const isSel = selEdgeId === e.id, bad = badEdges.has(e.id);
          const dur = clamp(2.6 - Math.log10(f + 1) * 0.5, 0.5, 2.6);
          return html`<g key=${e.id}>
            <path class=${cx('cv-edge', isSel && 'is-sel', bad && 'bad', overlay && f > 0 && !bad && 'flow')} d=${g.d} style=${'stroke-width:' + w.toFixed(2) + ';--dur:' + dur.toFixed(2) + 's'} marker-end=${'url(#' + gid + (isSel ? '-as' : '-a') + ')'} />
            <path class="cv-edge-hit" d=${g.d} data-role="edge" data-id=${e.id} />
            ${overlay && f > 0 && html`<text class="cv-edge-label" x=${g.mx} y=${g.my - 6} text-anchor="middle">${fmt.rps(f)}/s</text>`}
          </g>`;
        })}
        ${src && html`<path class="cv-temp" d=${'M' + (pos(src).x + NW) + ' ' + (pos(src).y + NH / 2) + ' L' + drag.x + ' ' + drag.y} />`}
        ${d.nodes.map(n => {
          const p = pos(n);
          const ns = sim && sim.ok ? sim.byId[n.id] : null;
          const st = ns && n.type !== 'client' ? ns.status : 'idle';
          const P = E.propsOf(n);
          const reps = E.replicasOf(n);
          const isB = overlay && highlight === n.id;
          const label = (n.label || '').length > 17 ? n.label.slice(0, 16) + '…' : n.label;
          const where = n.type === 'cdn' ? 'edge' : (regionShort[P.region] || P.region || 'us-east');
          return html`<g key=${n.id} class=${cx('cv-node', overlay && 'overlay', 's-' + st, selNodeId === n.id && 'is-sel', pending === n.id && 'is-src', drag && drag.kind === 'connect' && drag.over === n.id && 'is-target')} transform=${'translate(' + p.x + ' ' + p.y + ')'} data-role="node" data-id=${n.id}>
            ${isB && html`<rect class="cv-bneck" x="-7" y="-7" width=${NW + 14} height=${NH + 14} rx="12" />`}
            ${isB && html`<g class="cv-bneck-tag" transform="translate(0 -30)"><rect width="86" height="17" rx="4" /><text x="7" y="12">BOTTLENECK</text></g>`}
            <rect class="cv-node-body" width=${NW} height=${NH} rx="8" />
            <rect class="cv-node-icon" x="10" y="12" width="40" height="40" rx="6" />
            <g class="cv-glyph"><${Glyph} type=${n.type} s=${22} x=${19} y=${21} /></g>
            <text class="cv-node-label" x="60" y="28">${label}</text>
            ${overlay && ns && n.type !== 'client'
              ? html`<text class="cv-node-sub" x="60" y="46"><tspan class=${'cv-pct s-' + st}>${fmt.util(ns.rho)}</tspan> · ${fmt.rps(ns.peak)}/s${reps > 1 ? ' · ×' + reps : ''}</text>`
              : html`<text class="cv-node-sub" x="60" y="46">${n.type === 'client' ? (ns ? fmt.rps(sim.rps) + ' rps · ' : '') + where : E.CATALOG[n.type].short + (reps > 1 ? ' ×' + reps : '') + ' · ' + where}</text>`}
            ${overlay && ns && n.type !== 'client' && html`<g><rect class="cv-meter-bg" x="60" y="53" width="112" height="3" rx="1.5" /><rect class=${'cv-meter s-' + st} x="60" y="53" width=${112 * Math.min(1, ns.rho)} height="3" rx="1.5" /></g>`}
            ${!readOnly && html`<circle class="cv-port in" cx="0" cy=${NH / 2} r="4" />`}
            ${!readOnly && html`<circle class="cv-port" cx=${NW} cy=${NH / 2} r="6.5" data-role="port" data-id=${n.id}><title>Drag to connect</title></circle>`}
          </g>`;
        })}
      </g>
    </svg>
    ${tools && tools({ zoom: v.k, api })}
    ${miniEl}
    ${overlay && sim && sim.ok && d.nodes.length > 0 && html`<div class="cv-legend" aria-hidden="true"><span><span class="sdot ok"></span>below 75%</span><span><span class="sdot warn"></span>75–99%</span><span><span class="sdot fail"></span>100%+</span></div>`}
    ${!d.nodes.length && html`<div class="cv-empty"><div><${Icon} n="layers" s=${28} /><b style="color:var(--ink-2)">The canvas is empty</b><span class="small">Drag a component from the palette, or click one to drop it here. Start with Clients: that is where traffic enters.</span></div></div>`}
  </div>`;
}

const PALETTE_GROUPS = [
  ['Traffic', ['client', 'cdn']],
  ['Routing', ['lb', 'gateway']],
  ['Compute', ['app', 'worker']],
  ['Data', ['cache', 'db', 'replica', 'storage']],
  ['Async and external', ['queue', 'external']]
];
const rpsToSlider = (r) => Math.round(Math.log10(Math.max(10, r) / 10) / Math.log10(5000) * 1000);
const sliderToRps = (v) => { const r = 10 * Math.pow(5000, v / 1000); return r >= 1000 ? Math.round(r / 50) * 50 : r >= 100 ? Math.round(r / 10) * 10 : Math.round(r); };
function defaultRegion(d) {
  const c = d.nodes.find(n => n.type === 'client');
  if (c) return E.propsOf(c).region || 'us-east';
  const any = d.nodes.find(n => n.props && n.props.region);
  return any ? any.props.region : 'us-east';
}
function Editor({ d }) {
  const s = S();
  const [sel, setSel] = useState(() => { const f = S().ui.focusNode; return f && d.nodes.some(n => n.id === f) ? { kind: 'node', id: f } : null; });
  const [overlay, setOverlay] = useState(true);
  const [connectMode, setConnectMode] = useState(false);
  const [ghost, setGhost] = useState(null);
  const api = useRef(null);
  useEffect(() => { if (S().ui.focusNode) { const f = S().ui.focusNode; setUI({ focusNode: null }); setTimeout(() => api.current && api.current.focus(f), 60); } }, []);
  const sim = simOf(d);
  const selNode = sel && sel.kind === 'node' ? d.nodes.find(n => n.id === sel.id) : null;
  const selEdge = sel && sel.kind === 'edge' ? d.edges.find(e => e.id === sel.id) : null;
  useEffect(() => { if (sel && !selNode && !selEdge) setSel(null); });

  const addAt = (type, wx, wy) => {
    let newId = null;
    Actions.updateDesign(d.id, (dd) => {
      const props = type === 'client' || type === 'cdn' ? {} : { region: defaultRegion(dd) };
      if (type === 'client') props.region = defaultRegion(dd);
      const n = E.addNode(dd, type, snapTo(wx - NW / 2), snapTo(wy - NH / 2), { props });
      newId = n.id;
      return dd;
    });
    if (newId) setSel({ kind: 'node', id: newId });
  };
  const onMove = (id, x, y) => Actions.updateDesign(d.id, (dd) => { const n = dd.nodes.find(z => z.id === id); if (n) { n.x = x; n.y = y; } return dd; }, { undoKey: 'move:' + id });
  const onConnect = (from, to) => {
    const a = d.nodes.find(n => n.id === from), b = d.nodes.find(n => n.id === to);
    if (!a || !b || from === to) return;
    if (b.type === 'client') { Actions.toast('Clients only send traffic, so nothing can connect into them.', 'warn'); return; }
    if (d.edges.some(e => e.from === from && e.to === to)) { Actions.toast(a.label + ' is already connected to ' + b.label + '.', 'info'); return; }
    let eid = null;
    Actions.updateDesign(d.id, (dd) => { const e = E.addEdge(dd, from, to); eid = e && e.id; return dd; });
    const after = S().designs[d.id];
    const v = E.validate(after);
    if (v.errors.some(x => x.code === 'CYCLE')) Actions.toast('That edge creates a cycle. The simulation stops until you delete one edge in the loop.', 'warn', { action: { label: 'Undo', run: () => Actions.undo(d.id) } });
    if (eid) setSel({ kind: 'edge', id: eid });
  };
  const del = () => {
    if (selNode) {
      const label = selNode.label;
      Actions.updateDesign(d.id, (dd) => { dd.nodes = dd.nodes.filter(n => n.id !== selNode.id); dd.edges = dd.edges.filter(e => e.from !== selNode.id && e.to !== selNode.id); return dd; });
      setSel(null);
      Actions.toast('Deleted ' + label + '.', 'info', { action: { label: 'Undo', run: () => Actions.undo(d.id) } });
    } else if (selEdge) {
      Actions.updateDesign(d.id, (dd) => { dd.edges = dd.edges.filter(e => e.id !== selEdge.id); return dd; });
      setSel(null);
      Actions.toast('Deleted the connection.', 'info', { action: { label: 'Undo', run: () => Actions.undo(d.id) } });
    }
  };
  const dup = () => {
    if (!selNode) return;
    let newId = null;
    Actions.updateDesign(d.id, (dd) => { const n = E.addNode(dd, selNode.type, selNode.x + 36, selNode.y + 84, { props: Object.assign({}, selNode.props), label: selNode.label + ' copy' }); newId = n.id; return dd; });
    if (newId) setSel({ kind: 'node', id: newId });
  };
  const nudge = (dx, dy) => { if (selNode) onMove(selNode.id, selNode.x + dx, selNode.y + dy); };

  useEffect(() => {
    const onKey = (e) => {
      if (isTyping(document.activeElement)) return;
      const st = S();
      if (st.ui.palette || st.ui.shortcuts || st.ui.feedback) return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) Actions.redo(d.id); else Actions.undo(d.id); return; }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); Actions.redo(d.id); return; }
      if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); dup(); return; }
      if (mod) return;
      if (e.key === 'Delete' || e.key === 'Backspace') { if (sel) { e.preventDefault(); del(); } return; }
      if (e.key === 'Escape') { if (connectMode) setConnectMode(false); else setSel(null); return; }
      if (e.key === 'c' || e.key === 'C') { setConnectMode(m => !m); return; }
      if (e.key === 'l' || e.key === 'L') { setOverlay(o => !o); return; }
      if (e.key === 'f' || e.key === 'F') { api.current && api.current.fit(); return; }
      if (e.key === '+' || e.key === '=') { api.current && api.current.zoomBy(1.2); return; }
      if (e.key === '-' || e.key === '_') { api.current && api.current.zoomBy(1 / 1.2); return; }
      const step = e.shiftKey ? 48 : GRID;
      if (selNode && e.key.indexOf('Arrow') === 0) {
        e.preventDefault();
        if (e.key === 'ArrowLeft') nudge(-step, 0); if (e.key === 'ArrowRight') nudge(step, 0);
        if (e.key === 'ArrowUp') nudge(0, -step); if (e.key === 'ArrowDown') nudge(0, step);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  // Palette drag: a ghost follows the pointer; dropping inside the canvas places the component.
  useEffect(() => {
    if (!ghost) return;
    const move = (e) => setGhost(g => g && Object.assign({}, g, { x: e.clientX, y: e.clientY, moved: g.moved || Math.abs(e.clientX - g.sx) + Math.abs(e.clientY - g.sy) > 5 }));
    const up = (e) => {
      setGhost(g => {
        if (g && api.current) {
          if (!g.moved) { const c = api.current.center(); addAt(g.type, c.x + (Math.random() - 0.5) * 60, c.y + (Math.random() - 0.5) * 60); }
          else if (api.current.inside(e.clientX, e.clientY)) { const w = api.current.toWorld(e.clientX, e.clientY); addAt(g.type, w.x, w.y); }
